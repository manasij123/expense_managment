<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Expense Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

</head>
<body class="font-sans min-h-screen">

    <header class="glass-header sticky top-0 z-30 px-4 sm:px-6 py-3 flex justify-between items-center">
        <h1 class="font-bold text-lg sm:text-xl tracking-tight text-slate-700 flex items-center">
            <svg class="w-6 h-6 sm:w-8 sm:h-8 mr-2" viewBox="0 0 10838 6221" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5338.5 103.799L5581 842.8V1925.3L5499 1953.8C4218 -256.205 1975 509.795 1564.5 2344.8H5141L4901 2899.8H1506.5C1493.48 3060.46 1494.38 3153.81 1506.5 3314.8H5099.5L4889.5 3875.3H1609.5C2175.5 5900.79 4405 6094.56 5489 4550.3L5579.5 4611.3V5381.8C4020 6939.29 1289.5 6264.29 757.5 3875.3H4L199 3319.8H680.5C670.018 3155.39 668.151 3063.64 672 2899.8H0L196.5 2345.3H741C1155.5 355.301 3118 -558.205 4825.5 355.3L4984.5 103.799H5338.5Z" fill="#6155F5"/>
                <path fill-rule="evenodd" clip-rule="evenodd" d="M7460.82 2358.29H9004.18L9848.68 484.795H10837.5V5571.29H10064.5V1640.7L9519.83 2894.79H6369.5V3315.79H9314.28L8531.46 5046L8531.32 5046.29H7892.68L7357.18 3883.29H6369.5V5571.29H5586V3883.29H4885.78L5095.53 3316.12L5095.65 3315.79H5586V2894.79H4902.24L5133.04 2358.6L5133.17 2358.29H5586V484.795H6595.82L7460.82 2358.29ZM8133.74 3869.79L8224 4081.06L8314.76 3869.79H8133.74ZM6355 1675.29V2350.79H6665.78L6355.95 1675.09L6355 1675.29Z" fill="#34C759"/>
            </svg>
            EXPENSE MANAGEMENT
        </h1>
        <div class="flex items-center gap-4">
            <div class="flex flex-col items-end">
                <div class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">
                    {{ now().strftime('%B %Y') }}
                </div>
                <div id="live-clock" class="text-xs font-mono text-slate-500 mt-1"></div>
            </div>
            <button id="theme-toggle" class="w-10 h-10 rounded-full text-slate-500 hover:bg-black/5 flex items-center justify-center transition">
                <i class="fas fa-moon text-lg"></i> <!-- Moon Icon -->
                <i class="fas fa-sun text-lg hidden"></i> <!-- Sun Icon -->
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 max-w-3xl fade-in pb-24 mt-12">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Flat Expense Card -->
            <a href="{{ url_for('flat_expense') }}" class="glass-card p-8 text-center group">
                <div class="w-20 h-20 rounded-full bg-indigo-100 text-indigo-500 flex items-center justify-center mb-4 mx-auto group-hover:scale-110 transition-transform duration-300">
                    <i class="fas fa-building text-4xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-1">Flat Expenses</h2>
                <p class="text-sm text-slate-500">Manage monthly maintenance, lift, and other flat-related costs.</p>
            </a>

            <!-- Newspaper Tracker Card -->
            <a href="{{ url_for('newspaper') }}" class="glass-card p-8 text-center group">
                <div class="w-20 h-20 rounded-full bg-orange-100 text-orange-500 flex items-center justify-center mb-4 mx-auto group-hover:scale-110 transition-transform duration-300">
                    <i class="fas fa-newspaper text-4xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-1">Newspaper Tracker</h2>
                <p class="text-sm text-slate-500">Track your daily newspaper deliveries and calculate monthly bills.</p>
            </a>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
